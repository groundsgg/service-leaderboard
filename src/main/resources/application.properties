quarkus.http.host=0.0.0.0
quarkus.http.port=9000
quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}

# The OpenAPI document is written at build time and published to
# groundsgg/api-reference on release. Rendering stays central: this service does
# not serve a Swagger UI of its own.
quarkus.smallrye-openapi.info-title=Leaderboard API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.store-schema-directory=build/generated/openapi
quarkus.smallrye-openapi.store-schema-file-name=openapi
# Security is declared once on OpenApiConfiguration; auto-adding would attach a
# second, wrong scheme derived from the JWT extension.
quarkus.smallrye-openapi.auto-add-security=false
quarkus.swagger-ui.enabled=false
quarkus.swagger-ui.always-include=false

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/app?currentSchema=leaderboard}
quarkus.datasource.username=${POSTGRES_USER:app}
quarkus.datasource.password=${POSTGRES_PASSWORD:app}
# Agroal pool gauges on /q/metrics: agroal_active_count, agroal_available_count,
# agroal_awaiting_count. This is the signal that a pool is running out — without
# it, exhaustion only shows up as services crash-looping at startup.
# BUILD_AND_RUN_TIME_FIXED: it cannot be switched on with an env var later.
quarkus.datasource.jdbc.metrics.enabled=true
# Names this service's connections in pg_stat_activity and PgBouncer SHOW CLIENTS.
quarkus.datasource.jdbc.additional-jdbc-properties.ApplicationName=service-leaderboard

quarkus.flyway.schemas=leaderboard
quarkus.flyway.migrate-at-start=true
quarkus.flyway.create-schemas=true

# In prod, POSTGRES_URL may point at PgBouncer in transaction mode, which
# Flyway's session-level SETs and locks do not survive. Flyway runs on its own
# datasource straight to the primary instead (POSTGRES_DIRECT_URL, app-db-rw),
# and falls back to POSTGRES_URL where no direct URL is set.
%prod.quarkus.datasource.migrations.db-kind=postgresql
%prod.quarkus.datasource.migrations.jdbc.url=${POSTGRES_DIRECT_URL:${POSTGRES_URL}}
%prod.quarkus.datasource.migrations.username=${POSTGRES_USER}
%prod.quarkus.datasource.migrations.password=${POSTGRES_PASSWORD}
%prod.quarkus.datasource.migrations.jdbc.min-size=0
%prod.quarkus.datasource.migrations.jdbc.max-size=2
%prod.quarkus.datasource.migrations.jdbc.additional-jdbc-properties.ApplicationName=service-leaderboard-migrations
%prod.quarkus.datasource.migrations.health-exclude=true
%prod.quarkus.flyway.migrate-at-start=false
%prod.quarkus.flyway.migrations.schemas=leaderboard
%prod.quarkus.flyway.migrations.create-schemas=true
%prod.quarkus.flyway.migrations.migrate-at-start=true

# Top-N query cap — server-side ceiling on GetTopRequest.limit.
grounds.leaderboard.top.limit-cap=${LEADERBOARD_TOP_LIMIT_CAP:1000}

# Idempotency window — how long an idempotency_key is remembered. The
# lookup itself has no time filter: a key deduplicates for as long as its
# row exists, and the pruner below is what ends that. It must outlive every
# way a submission can be redelivered: LEADERBOARD_SCORES keeps messages
# for 7 days, and an ACCUMULATE board would double-count a redelivery that
# arrives after its key was pruned. Hence 8 days, not minutes.
grounds.leaderboard.submit.idempotency-window=${LEADERBOARD_IDEMPOTENCY_WINDOW:8d}
# Off by default: until it is switched on, keys are kept forever (the
# behaviour before the pruner existed).
grounds.leaderboard.submit.idempotency-prune.enabled=${LEADERBOARD_IDEMPOTENCY_PRUNE_ENABLED:false}
grounds.leaderboard.submit.idempotency-prune.every=${LEADERBOARD_IDEMPOTENCY_PRUNE_EVERY:1h}

# The score stream. Score submissions nobody waits on (service-match's
# rated results) arrive on the LEADERBOARD_SCORES JetStream stream as
# `leaderboard.score.submitted.<boardId>`, with the same JSON body as
# POST /v1/leaderboards/{boardId}/scores. The consumer runs where the hub
# is (core); the stream and the consumer's NATS user are provisioned by
# grounds-pulumi, so this side never creates a stream. Off by default.
grounds.leaderboard.consumer.enabled=${LEADERBOARD_CONSUMER_ENABLED:false}
grounds.leaderboard.consumer.stream=${LEADERBOARD_CONSUMER_STREAM:LEADERBOARD_SCORES}
grounds.leaderboard.consumer.durable=${LEADERBOARD_CONSUMER_DURABLE:leaderboard-writer}
grounds.leaderboard.consumer.poll-interval=${LEADERBOARD_CONSUMER_POLL_INTERVAL:1s}
grounds.leaderboard.consumer.batch-size=${LEADERBOARD_CONSUMER_BATCH_SIZE:50}
# How long a submission that failed for a transient reason (the database)
# waits before JetStream offers it again.
grounds.leaderboard.consumer.retry-delay=${LEADERBOARD_CONSUMER_RETRY_DELAY:5s}
# Credentials, when needed, travel in the URL (nats://user:pass@host:4222).
nats.url=${NATS_URL:nats://nats.nats.svc.cluster.local:4222}

# JWT validation — verifies every incoming call's Bearer token against
# the k8s API-server's JWKS endpoint. Audience binds the token to this
# service class. Both transports share the verdict.
#
# In-cluster: kubernetes.default.svc resolves correctly. Disable
# (set grounds.auth.enabled=false) for local dev where there's no
# projected SA-Token volume to attach.
grounds.auth.enabled=${GROUNDS_AUTH_ENABLED:true}
grounds.auth.jwks-url=${GROUNDS_AUTH_JWKS_URL:https://kubernetes.default.svc/openid/v1/jwks}
grounds.auth.expected-audience=${GROUNDS_AUTH_AUDIENCE:grounds-services}
grounds.auth.k8s-ca-file=${GROUNDS_AUTH_K8S_CA_FILE:/var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
grounds.auth.k8s-token-file=${GROUNDS_AUTH_K8S_TOKEN_FILE:/var/run/secrets/kubernetes.io/serviceaccount/token}

# OpenTelemetry — emits a span per incoming call to Alloy, which
# forwards to Tempo (visible in Grafana at grafana.platform.grnds.io).
# Disabled by default in local dev because there's no Alloy to talk to;
# the cluster-deployed Helm chart sets OTEL_SDK_DISABLED=false.
quarkus.application.name=service-leaderboard
# Stamped into the published OpenAPI document, so a reader can tell which build
# a snapshot describes.
quarkus.application.version=${QUARKUS_APPLICATION_VERSION:dev}
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.observability.svc.cluster.local:4317}
