quarkus.flyway.migrate-at-start=false
quarkus.scheduler.enabled=false

# No kubelet projects a ServiceAccount token into a test JVM, so there is no
# credential any caller could present and nothing to verify it against. With
# auth off every caller is let through as `local-development`, which is
# deliberately not an admin subject — the season-reset check is exercised
# directly instead, in LeaderboardResourceTest.
grounds.auth.enabled=false
